<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | BEETRX CRM</title>
    <link rel="icon" type="image/png" href="./uploads/company/favicon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #0b0d14;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            pointer-events: none;
        }
        .glow-1 {
            width: 350px;
            height: 350px;
            background: #d4af37;
            top: -100px;
            left: -100px;
        }
        .glow-2 {
            width: 400px;
            height: 400px;
            background: #8b5cf6;
            bottom: -120px;
            right: -120px;
        }
        .offline-card {
            background: rgba(18, 21, 30, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: relative;
            z-index: 2;
        }
        .logo-wrap {
            margin-bottom: 25px;
        }
        .logo-wrap img {
            max-height: 42px;
            width: auto;
            object-fit: contain;
        }
        .icon-wrap {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            color: #ffd700;
        }
        .icon-wrap svg {
            width: 36px;
            height: 36px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .retry-btn {
            background: linear-gradient(135deg, #d4af37 0%, #f5d77f 50%, #aa820a 100%);
            color: #0b0d11;
            font-weight: 700;
            font-size: 15px;
            padding: 13px 32px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
        }
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #ffd700 0%, #fceda1 50%, #c49910 100%);
        }
        .retry-btn:active {
            transform: translateY(0);
        }
        .status-pill {
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 5px 14px;
            border-radius: 999px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="offline-card">
        <div class="logo-wrap">
            <img src="./uploads/company/logo-dark.png" alt="BEETRX CRM" onerror="this.src='./uploads/company/logo.png'">
        </div>

        <div class="icon-wrap">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
        </div>

        <h1>Internet Connection Lost</h1>
        <p>You are currently offline. BEETRX Web App needs an active internet connection to safely sync CRM data with the secure server.</p>

        <button class="retry-btn" onclick="retryConnection()">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
            Retry Connection
        </button>

        <br>
        <div class="status-pill">
            <span class="status-dot"></span> Offline
        </div>
    </div>

    <script>
        function retryConnection() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                var btn = document.querySelector('.retry-btn');
                btn.style.opacity = '0.6';
                setTimeout(function() {
                    btn.style.opacity = '1';
                    alert('Still offline. Please check your Wi-Fi or mobile data.');
                }, 600);
            }
        }

        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
